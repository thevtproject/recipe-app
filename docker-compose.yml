services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recipe_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipe_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-recipe_dev}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-recipe_dev_db}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-recipe_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/public/uploads
    volumes:
      - uploads:/app/public/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: recipe-app-app:latest
    env_file: .env.prod
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/public/uploads
    volumes:
      - uploads:/app/public/uploads
    networks:
      - internal
    depends_on:
      db-dev:
        condition: service_healthy

  migrate-dev:
    image: recipe-app-app-dev:latest
    env_file: .env.dev
    networks:
      - internal
    depends_on:
      db-dev:
        condition: service_healthy
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "0:0"
    env_file: .env.prod
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:-./cloudflared}:/etc/cloudflared:ro
    networks:
      - internal
    depends_on:
      - nginx

volumes:
  pgdata:
  pgdata-dev:
  uploads:

networks:
  internal:
