# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name recipes.thevtproject.my.id;

    # Allow Certbot ACME challenges (unused for DNS-01 but harmless)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main app
server {
    listen 443 ssl;
    http2 on;
    server_name recipes.thevtproject.my.id;

    ssl_certificate     /etc/letsencrypt/live/recipes.thevtproject.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipes.thevtproject.my.id/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Max upload size (match 5MB app limit)
    client_max_body_size 6M;

    # Static files — served by Next.js standalone but cache headers help
    location /_next/static/ {
        proxy_pass http://app:3000/_next/static/;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded food photos
    location /uploads/ {
        proxy_pass http://app:3000/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
