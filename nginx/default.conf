# HTTP only — TLS handled by Cloudflare Tunnel upstream

# === Dev endpoint ===
server {
    listen 80;
    server_name dev.vtproject.my.id;

    client_max_body_size 6M;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /_next/static/ {
        proxy_pass http://app-dev:3000/_next/static/;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://app-dev:3000/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://app-dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

# === Prod endpoint ===
server {
    listen 80;
    server_name recipes.vtproject.my.id;

    # Max upload size (match 5MB app limit)
    client_max_body_size 6M;

    # Real IP from Cloudflare Tunnel
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;

    # Security headers (Cloudflare adds HSTS externally)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static files
    location /_next/static/ {
        proxy_pass http://app:3000/_next/static/;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded food photos
    location /uploads/ {
        proxy_pass http://app:3000/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
