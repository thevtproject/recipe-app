name: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Build & Deploy to Dev
    runs-on: [self-hosted, linux, x64, icon-local]

    steps:
      - uses: actions/checkout@v4

      - name: Create env files for docker compose
        run: |
          # .env files are gitignored — docker compose needs them to exist
          touch .env.dev .env.prod

      - name: TypeScript check
        run: |
          docker compose run --rm -w /app migrate-dev \
            npx tsc --noEmit

      - name: Build dev image
        run: |
          docker compose build app-dev

      - name: Stop & remove old dev container
        run: |
          docker stop recipe-app-app-dev-1 2>/dev/null || true
          docker rm recipe-app-app-dev-1 2>/dev/null || true

      - name: Start new dev container
        run: |
          docker compose up -d app-dev

      - name: Reload nginx (flush DNS cache)
        run: |
          docker exec recipe-app-nginx-1 nginx -s reload 2>/dev/null || true

      - name: Verify dev is serving
        run: |
          sleep 3
          curl -sL -o /dev/null -w "Dev HTTP status: %{http_code}\n" \
            https://dev.vtproject.my.id
